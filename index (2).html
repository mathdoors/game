<script>
/* ======================================================
   CORE STATE
====================================================== */
let gameLocked = false;
let score = 0;
let lives = 3;
let difficulty = null;
let currentAnswer = "";
let timerInterval = null;
let timeLeft = 15;
let startTime = 0;
let currentGrade = 1;
let comboCount = 0;        // BUG FIX: track consecutive correct answers
let audioCtx = null;       // BUG FIX: lazy AudioContext init

const hearts = [
  document.getElementById('h0'),
  document.getElementById('h1'),
  document.getElementById('h2')
];

/* ======================================================
   AUDIO — lazy init to avoid browser autoplay block
====================================================== */
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq,dur,type='square'){
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type=type;
    o.frequency.value=freq;
    o.connect(g);g.connect(ctx.destination);
    g.gain.value=0.08;
    o.start();setTimeout(()=>o.stop(),dur);
  }catch(e){}
}

/* ======================================================
   UTILITIES
====================================================== */
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ======================================================
   BUG FIX: single canonical normalize()
   Handles: spaces, "remainder"→"r", trailing .0,
   leading zeros, and ".6" == "0.6"
====================================================== */
function normalize(val){
  let s = val.toString().toLowerCase().trim();
  s = s.replace(/\s+/g,'');
  s = s.replace(/remainder/g,'r');
  s = s.replace(/\.0+$/,'');
  // normalise ".6" → "0.6"
  s = s.replace(/^\./, '0.');
  // normalise "00" etc
  s = s.replace(/^0+(\d)/, '$1');
  return s;
}

/* ======================================================
   DAILY STREAK
====================================================== */
function checkStreak(){
  const today = new Date().toDateString();
  const stored = localStorage.getItem('md_last_visit');
  let streak = parseInt(localStorage.getItem('md_streak')||'0');
  if(stored === today){
    // already visited today, just read streak
  } else {
    const yesterday = new Date(Date.now()-86400000).toDateString();
    streak = (stored === yesterday) ? streak+1 : 1;
    localStorage.setItem('md_streak',streak);
    localStorage.setItem('md_last_visit',today);
  }
  if(streak >= 2){
    const banner = document.getElementById('dailyStreak');
    banner.textContent = '🔥 DAY '+streak+' STREAK! WELCOME BACK!';
    banner.style.display = 'block';
    setTimeout(()=>{ banner.style.display='none'; }, 4000);
  }
  const badge = document.getElementById('streakBadge');
  if(streak >= 2){
    badge.textContent = '🔥 '+streak+' DAY STREAK';
    badge.style.display = 'block';
  }
}

/* ======================================================
   CURRICULUM — all bugs fixed
====================================================== */
const CURRICULUM = {

/* ===================== GRADE 1 ===================== */
1:{
  easy:{generate(){
    switch(rand(1,5)){
      case 1: return pick([
        ["What shape has 3 sides?","triangle"],
        ["What shape is round?","circle"],
        ["What shape has 4 equal sides?","square"],
        ["What shape has 4 sides but is longer?","rectangle"]
      ]);
      case 2:{ let n=rand(1,10); return [`Count: ${"⭐".repeat(n)}`,n]; }
      case 3:{ let n=rand(0,19); return [`What comes after ${n}?`,n+1]; }
      case 4:{ let n=rand(1,20); return [`What comes before ${n}?`,n-1]; }
      case 5:{ let a=rand(1,20),b=rand(1,20); return [`Which is bigger: ${a} or ${b}?`,Math.max(a,b)]; }
    }
  }},
  medium:{generate(){
    switch(rand(1,4)){
      case 1:{ let a=rand(0,10),b=rand(0,10); return [`${a} + ${b}`,a+b]; }
      case 2:{ let a=rand(5,15),b=rand(0,5); return [`${a} - ${b}`,a-b]; }
      case 3:{ let a=rand(1,10),b=rand(1,10); return [`__ + ${a} = ${a+b}`,b]; }
      case 4:{ let n=rand(1,10); return [`Double ${n}`,n*2]; }
    }
  }},
  hard:{generate(){
    switch(rand(1,5)){
      case 1:{ let a=rand(10,20),b=rand(1,10); return [`${a} + ${b}`,a+b]; }
      case 2:{ let a=rand(15,30),b=rand(1,10); if(b>a)b=a; return [`${a} - ${b}`,a-b]; }
      case 3:{ let a=rand(1,20),b=rand(1,20); let ans=a>b?">":a<b?"<":"="; return [`${a} __ ${b} (>,<,=)`,ans]; }
      case 4:{ let tens=rand(1,3),ones=rand(0,9); return [`${tens} tens + ${ones} ones`,tens*10+ones]; }
      case 5:{ let a=rand(5,15),b=rand(1,5); return [`${a} apples, eat ${b}. Left?`,a-b]; }
    }
  }}
},

/* ===================== GRADE 2 ===================== */
2:{
  easy:{generate(){
    switch(rand(1,5)){
      case 1:{ let n=rand(1,98); return [`What comes after ${n}?`,n+1]; }
      case 2:{ let n=rand(1,20)*2; return [`Count by 2s: ${n}, __`,n+2]; }
      case 3:{ let n=rand(1,8)*10; return [`Count by 10s: ${n}, __`,n+10]; }
      case 4:{ let a=rand(10,99),b=rand(10,99); return [`Which is greater: ${a} or ${b}?`,Math.max(a,b)]; }
      case 5:{ let t=rand(1,9),o=rand(0,9); return [`${t} tens + ${o} ones`,t*10+o]; }
    }
  }},
  medium:{generate(){
    switch(rand(1,5)){
      case 1:{ let a=rand(10,49),b=rand(10,40); return [`${a} + ${b}`,a+b]; }
      case 2:{ let a=rand(30,99),b=rand(10,29); if(a<b)[a,b]=[b,a]; return [`${a} - ${b}`,a-b]; }
      case 3:{ let a=rand(10,40),b=rand(10,40); return [`__ + ${a} = ${a+b}`,b]; }
      case 4:{ let n=rand(1,10)*5; return [`Count by 5s: ${n}, __`,n+5]; }
      case 5:{ let a=rand(10,99),b=rand(10,99); let ans=a>b?">":a<b?"<":"="; return [`${a} __ ${b} (>,<,=)`,ans]; }
    }
  }},
  hard:{generate(){
    switch(rand(1,6)){
      case 1:{ let a=rand(25,75),b=rand(15,45); return [`${a} + ${b}`,a+b]; }
      case 2:{ let a=rand(40,99),b=rand(15,39); if(b>a)b=a-1; return [`${a} - ${b}`,a-b]; }
      case 3:{ let a=rand(20,50),b=rand(5,15); return [`You have ${a}, gain ${b}. Total?`,a+b]; }
      case 4:{ let groups=rand(2,5),each=rand(2,5); return [`${groups} groups of ${each}`,groups*each]; }
      case 5:{ let num=rand(20,99),tens=Math.floor(num/10); return [`How many tens in ${num}?`,tens]; }
      case 6:{ let start=rand(2,10); return [`${start}, ${start*2}, ${start*3}, __`,start*4]; }
    }
  }}
},

/* ===================== GRADE 3 ===================== */
3:{
  easy:{generate(){
    switch(rand(1,6)){
      case 1:{ let a=rand(0,5),b=rand(0,5); return [`${a} × ${b}`,a*b]; }
      case 2:{ let b=rand(1,5),ans=rand(1,5); return [`${b*ans} ÷ ${b}`,ans]; }

/* ======================================================
   GRADE SELECTOR — build both desktop and mobile
====================================================== */
const gradePanel = document.getElementById('gradePanel');
const gradeMobile = document.getElementById('gradeMobile');

for(let i=1;i<=9;i++){
  // Desktop box
  const box = document.createElement('div');
  box.className = 'gradeBox' + (i===1?' gradeSelected':'');
  box.innerText = 'GRADE '+i;
  box.onclick = ()=>selectGrade(i);
  gradePanel.appendChild(box);

  // Mobile tab
  const tab = document.createElement('div');
  tab.className = 'gradeTab' + (i===1?' gradeTabSelected':'');
  tab.innerText = 'G'+i;
  tab.onclick = ()=>selectGrade(i);
  gradeMobile.appendChild(tab);
}

function selectGrade(g){
  if(gameLocked) return;
  currentGrade = g;
  document.querySelectorAll('.gradeBox').forEach((b,i)=>b.classList.toggle('gradeSelected',i===g-1));
  document.querySelectorAll('.gradeTab').forEach((b,i)=>b.classList.toggle('gradeTabSelected',i===g-1));
  restartGame();
}

/* ======================================================
   ELEMENT REFS (declared before use)
====================================================== */
const doorsEl = document.getElementById('doors');
const questionEl = document.getElementById('question');
const answerEl = document.getElementById('answer');
const timerEl = document.getElementById('timer');
const timerFill = document.getElementById('timerFill');
const scoreEl = document.getElementById('score');
const gameAreaEl = document.getElementById('gameArea');
const gameOverEl = document.getElementById('gameOver');
const highScoreText = document.getElementById('highScoreText');
const wrongReveal = document.getElementById('wrongReveal');
const comboDisplay = document.getElementById('comboDisplay');
const flash = document.getElementById('transitionFlash');

/* ======================================================
   GAME FLOW
====================================================== */
function startGame(e, level){
  if(gameLocked) return;
  gameLocked = true;
  getAudioCtx(); // init on user gesture
  difficulty = level;
  beep(600,120);
  const door = e.currentTarget;
  door.classList.remove('open');
  void door.offsetWidth;
  door.classList.add('open');
  setTimeout(()=>{
    screenFlash();
    doorsEl.style.display = 'none';
    gameAreaEl.style.display = 'block';
    wrongReveal.style.display = 'none';
    generateQuestion();
    startTimer();
    answerEl.focus();
    gameLocked = false;
  }, 550);
}

/* ======================================================
   TIMER — BUG FIX: use Date.now() for drift-free countdown
====================================================== */
function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 15;
  updateTimer();
  const deadline = Date.now() + 15000;
  timerInterval = setInterval(()=>{
    if(gameLocked) return;
    timeLeft = Math.max(0, Math.round((deadline - Date.now())/1000));
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      loseLife(true); // timeout = true
    }
  }, 250); // poll 4x/sec for smooth bar
}

function updateTimer(){
  timerEl.innerText = 'TIME: '+timeLeft;
  // BUG FIX: colour shift as time runs out
  if(timeLeft <= 4){
    timerEl.style.color = '#ff003c';
    timerFill.style.background = '#ff003c';
  } else if(timeLeft <= 8){
    timerEl.style.color = '#ff8800';
    timerFill.style.background = '#ff8800';
  } else {
    timerEl.style.color = '#ffd000';
    timerFill.style.background = '#ffd000';
  }
  timerFill.style.width = (timeLeft/15*100)+'%';
}

/* ======================================================
   QUESTION GENERATION
   BUG FIX: startTime reset here so speed bonus is per-question
====================================================== */
function generateQuestion(){
  const level = difficulty==='green'?'easy':difficulty==='yellow'?'medium':'hard';
  if(!CURRICULUM[currentGrade]||!CURRICULUM[currentGrade][level]){
    console.error('Curriculum missing: grade',currentGrade,'level',level);
    return;
  }
  const q = CURRICULUM[currentGrade][level].generate();
  questionEl.innerText = q[0];
  currentAnswer = String(q[1]);
  startTime = Date.now(); // BUG FIX: per-question start time
  answerEl.value = '';
  wrongReveal.style.display = 'none';
}

/* ======================================================
   ANSWER SUBMISSION
====================================================== */
function submitAnswer(){
  if(gameLocked) return;
  const val = normalize(answerEl.value);
  if(val==="") return;
  gameLocked = true;
  clearInterval(timerInterval);
  if(val === normalize(currentAnswer)){
    correct();
  } else {
    loseLife(false);
  }
}

function correct(){
  beep(1000,120);
  const t = (Date.now()-startTime)/1000;
  const base = difficulty==='green'?25:difficulty==='yellow'?100:250;
  const mult = t<6?2:t<11?1.5:1;

  comboCount++;
  let comboBonus = 1;
  if(comboCount >= 3) comboBonus = 2;
  else if(comboCount >= 5) comboBonus = 3;

  const earned = Math.floor(base * mult * comboBonus);
  score += earned;
  scoreEl.innerText = 'SCORE: '+score;

  // Save running high score in case tab closes
  const key='highscore_grade_'+currentGrade;
  const best=parseInt(localStorage.getItem(key)||'0');
  if(score>best) localStorage.setItem(key,score);

  // Show combo banner
  if(comboCount >= 3){
    showCombo(comboCount, comboBonus);
  }

  setTimeout(()=>{
    backToDoors();
    gameLocked = false;
  }, 250);
}

function showCombo(count, mult){
  comboDisplay.textContent = '🔥 '+count+' IN A ROW! x'+mult+' BONUS!';
  comboDisplay.style.display = 'block';
  clearTimeout(comboDisplay._timer);
  comboDisplay._timer = setTimeout(()=>{ comboDisplay.style.display='none'; }, 1800);
}

/* ======================================================
   LOSE LIFE
   BUG FIX: consolidated path, no race condition
====================================================== */
function loseLife(timedOut){
  // gameLocked is already true from submitAnswer OR we set it here for timer path
  gameLocked = true;
  clearInterval(timerInterval);
  beep(150,400,'sawtooth');
  comboCount = 0; // reset combo

  // Show correct answer
  wrongReveal.textContent = (timedOut ? '⏰ TIME UP! ' : '✗ WRONG! ') + 'Answer: '+currentAnswer;
  wrongReveal.style.display = 'block';

  lives--;
  // BUG FIX: clamp to valid index range before touching DOM
  const idx = Math.max(0, Math.min(2, lives));
  if(lives >= 0 && lives <= 2) hearts[lives].classList.add('dead');

  if(lives <= 0){
    setTimeout(endGame, 900); // brief pause so they can read the answer
  } else {
    setTimeout(()=>{
      backToDoors();
      gameLocked = false;
    }, 900);
  }
}

/* ======================================================
   GAME OVER
====================================================== */
function endGame(){
  const key = 'highscore_grade_'+currentGrade;
  let best = parseInt(localStorage.getItem(key)||'0');
  if(score>best){ localStorage.setItem(key,score); best=score; }

  const diffLabel = difficulty==='green'?'Easy':difficulty==='yellow'?'Medium':'Hard';
  highScoreText.innerHTML =
    'FINAL SCORE: '+score+'<br><br>'+
    'BEST (GRADE '+currentGrade+'): '+best+'<br><br>'+
    'GRADE '+currentGrade+' · '+diffLabel.toUpperCase();

  gameAreaEl.style.display = 'none';
  gameOverEl.style.display = 'block';
}

/* ======================================================
   SHARE SCORE
====================================================== */
function shareScore(){
  const diffLabel = difficulty==='green'?'Easy':difficulty==='yellow'?'Medium':'Hard';
  const text = `🚪 Math Doors – Grade ${currentGrade} ${diffLabel}\nScore: ${score}\nCan you beat me? mathdoors.ca`;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('shareCopied').style.display='block';
    setTimeout(()=>document.getElementById('shareCopied').style.display='none',2500);
  }).catch(()=>{
    prompt('Copy this score:', text);
  });
}

/* ======================================================
   RESTART
   BUG FIX: gameLocked reset here
====================================================== */
function restartGame(){
  clearInterval(timerInterval);
  gameLocked = false; // BUG FIX
  score = 0; lives = 3; difficulty = null; comboCount = 0;
  scoreEl.innerText = 'SCORE: 0';
  hearts.forEach(h=>h.classList.remove('dead'));
  gameOverEl.style.display = 'none';
  gameAreaEl.style.display = 'none';
  doorsEl.style.display = 'flex';
  answerEl.value = '';
  wrongReveal.style.display = 'none';
  comboDisplay.style.display = 'none';
  timerEl.style.color = '#ffd000';
  timerFill.style.background = '#ffd000';
  timerFill.style.width = '100%';
}

/* ======================================================
   BACK TO DOORS
====================================================== */
function backToDoors(){
  gameAreaEl.style.display = 'none';
  doorsEl.style.display = 'flex';
  document.querySelectorAll('.door').forEach(d=>d.classList.remove('open'));
  answerEl.value = '';
  wrongReveal.style.display = 'none';
  timerEl.style.color = '#ffd000';
  timerFill.style.background = '#ffd000';
  timerFill.style.width = '100%';
}

/* ======================================================

function openPage(id){
  clearInterval(timerInterval);
  const content = PAGES[id];
  if(!content) return;
  pageContainer.innerHTML = content;
  pageOverlay.classList.add('visible');
  closePageBtn.style.display = 'block';
  if(id==='curriculum') showGrade(currentGrade);
}

function showGrade(g){
  const info = CURRICULUM_INFO[g];
  if(!info) return;
  for(let i=1;i<=9;i++){
    const btn=document.getElementById('gnav'+i);
    if(btn) btn.classList.toggle('active',i===g);
  }
  const detail = document.getElementById('gradeDetail');
  if(!detail) return;
  detail.innerHTML=`<div class="grade-card"><h3>GRADE ${g} — TOPICS COVERED</h3><ul>${info.topics.map(t=>`<li>${t}</li>`).join('')}</ul><h2 style="margin-top:20px">DIFFICULTY BREAKDOWN</h2><p><span class="tag easy">EASY</span> ${info.easy}</p><p><span class="tag med">MEDIUM</span> ${info.med}</p><p><span class="tag hard">HARD</span> ${info.hard}</p><p style="margin-top:20px"><button onclick="closePage();selectGrade(${g})" style="font-family:'Press Start 2P';font-size:9px;background:black;color:#00ffff;border:2px solid #00ffff;padding:12px 20px;cursor:pointer;">PLAY GRADE ${g}</button></p></div>`;
}

function closePage(){
  pageOverlay.classList.remove('visible');
  closePageBtn.style.display='none';
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePage();
});
