<script>
/* ======================================================
   CORE STATE
====================================================== */
let gameLocked = false;
let score = 0;
let lives = 3;
let difficulty = null;
let currentAnswer = "";
let timerInterval = null;
let timeLeft = 15;
let startTime = 0;
let currentGrade = 1;
let comboCount = 0;
let audioCtx = null;

const hearts = [
  document.getElementById('h0'),
  document.getElementById('h1'),
  document.getElementById('h2')
];

/* ======================================================
   AUDIO — lazy init
====================================================== */
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq,dur,type='square'){
  try{
    const ctx = getAudioCtx();
    if(ctx.state==='suspended') ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g);
    g.connect(ctx.destination);
    g.gain.value = 0.08;
    o.start();
    setTimeout(()=>o.stop(),dur);
  }catch(e){}
}

/* ======================================================
   UTILITIES
====================================================== */
function rand(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function normalize(val){
  let s = val.toString().toLowerCase().trim();
  s = s.replace(/\s+/g,'');
  s = s.replace(/remainder/g,'r');
  s = s.replace(/\.0+$/,'');
  s = s.replace(/^\./,'0.');
  s = s.replace(/^0+(\d)/,'$1');
  return s;
}

/* ======================================================
   DAILY STREAK
====================================================== */
function checkStreak(){
  const today = new Date().toDateString();
  const stored = localStorage.getItem('md_last_visit');
  let streak = parseInt(localStorage.getItem('md_streak')||'0');
  if(stored !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    streak = (stored === yesterday) ? streak+1 : 1;
    localStorage.setItem('md_streak',streak);
    localStorage.setItem('md_last_visit',today);
  }
  const badge = document.getElementById('streakBadge');
  if(streak >= 2){
    const banner = document.getElementById('dailyStreak');
    banner.textContent = '🔥 DAY '+streak+' STREAK! WELCOME BACK!';
    banner.style.display = 'block';
    setTimeout(()=>{ banner.style.display='none'; }, 4000);
    badge.textContent = '🔥 '+streak+' DAY STREAK';
    badge.style.display = 'block';
  }
}

/* ======================================================
   CURRICULUM
====================================================== */
const CURRICULUM = {
1:{
  easy:{generate(){
    switch(rand(1,5)){
      case 1: return pick([["What shape has 3 sides?","triangle"],["What shape is round?","circle"],["What shape has 4 equal sides?","square"],["What shape has 4 sides but is longer?","rectangle"]]);
      case 2:{let n=rand(1,10);return[`Count: ${"⭐".repeat(n)}`,n];}
      case 3:{let n=rand(0,19);return[`What comes after ${n}?`,n+1];}
      case 4:{let n=rand(1,20);return[`What comes before ${n}?`,n-1];}
      case 5:{let a=rand(1,20),b=rand(1,20);return[`Which is bigger: ${a} or ${b}?`,Math.max(a,b)];}
    }
  }},
  medium:{generate(){
    switch(rand(1,4)){
      case 1:{let a=rand(0,10),b=rand(0,10);return[`${a} + ${b}`,a+b];}
      case 2:{let a=rand(5,15),b=rand(0,5);return[`${a} - ${b}`,a-b];}
      case 3:{let a=rand(1,10),b=rand(1,10);return[`__ + ${a} = ${a+b}`,b];}
      case 4:{let n=rand(1,10);return[`Double ${n}`,n*2];}
    }
  }},
  hard:{generate(){
    switch(rand(1,5)){
      case 1:{let a=rand(10,20),b=rand(1,10);return[`${a} + ${b}`,a+b];}
      case 2:{let a=rand(15,30),b=rand(1,10);if(b>a)b=a;return[`${a} - ${b}`,a-b];}
      case 3:{let a=rand(1,20),b=rand(1,20);let ans=a>b?">":a<b?"<":"=";return[`${a} __ ${b} (>,<,=)`,ans];}
      case 4:{let t=rand(1,3),o=rand(0,9);return[`${t} tens + ${o} ones`,t*10+o];}
      case 5:{let a=rand(5,15),b=rand(1,5);return[`${a} apples, eat ${b}. Left?`,a-b];}
    }
  }}
},
2:{
  easy:{generate(){
    switch(rand(1,5)){

/* ======================================================
   GRADE SELECTOR — build all 9 boxes
====================================================== */
const gradePanel = document.getElementById('gradePanel');
const gradeMobileStrip = document.getElementById('gradeMobileStrip');

for(let i=1;i<=9;i++){
  const box = document.createElement('div');
  box.className = 'gradeBox' + (i===1?' gradeSelected':'');
  box.innerText = 'GRADE '+i;
  box.onclick = ()=>selectGrade(i);
  gradePanel.appendChild(box);

  const tab = document.createElement('div');
  tab.className = 'gradeTab' + (i===1?' gradeTabSelected':'');
  tab.innerText = 'G'+i;
  tab.onclick = ()=>selectGrade(i);
  gradeMobileStrip.appendChild(tab);
}

function selectGrade(g){
  if(gameLocked) return;
  currentGrade = g;
  document.querySelectorAll('.gradeBox').forEach((b,i)=>b.classList.toggle('gradeSelected',i===g-1));
  document.querySelectorAll('.gradeTab').forEach((b,i)=>b.classList.toggle('gradeTabSelected',i===g-1));
  restartGame();
}

/* ======================================================
   ELEMENT REFS
====================================================== */
const doorsEl = document.getElementById('doors');
const questionEl = document.getElementById('question');
const answerEl = document.getElementById('answer');
const timerEl = document.getElementById('timer');
const timerFill = document.getElementById('timerFill');
const scoreEl = document.getElementById('score');
const gameAreaEl = document.getElementById('gameArea');
const gameOverEl = document.getElementById('gameOver');
const highScoreText = document.getElementById('highScoreText');
const wrongReveal = document.getElementById('wrongReveal');
const comboDisplay = document.getElementById('comboDisplay');
const flash = document.getElementById('transitionFlash');

/* ======================================================
   GAME FLOW
====================================================== */
function startGame(e, level){
  if(gameLocked) return;
  gameLocked = true;
  getAudioCtx();
  difficulty = level;
  beep(600,120);
  const door = e.currentTarget;
  door.classList.remove('open');
  void door.offsetWidth;
  door.classList.add('open');
  setTimeout(()=>{
    screenFlash();
    doorsEl.style.display='none';
    gameAreaEl.style.display='block';
    wrongReveal.style.display='none';
    generateQuestion();
    startTimer();
    answerEl.focus();
    gameLocked = false;
  },550);
}

/* ======================================================
   TIMER
====================================================== */
function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 15;
  updateTimer();
  const deadline = Date.now() + 15000;
  timerInterval = setInterval(()=>{
    if(gameLocked) return;
    timeLeft = Math.max(0, Math.round((deadline - Date.now())/1000));
    updateTimer();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      loseLife(true);
    }
  },250);
}

function updateTimer(){
  timerEl.innerText = 'TIME: '+timeLeft;
  const col = timeLeft<=4 ? '#ff003c' : timeLeft<=8 ? '#ff8800' : '#ffd000';
  timerEl.style.color = col;
  timerFill.style.background = col;
  timerFill.style.width = (timeLeft/15*100)+'%';
}

/* ======================================================
   QUESTIONS
====================================================== */
function generateQuestion(){
  const level = difficulty==='green'?'easy':difficulty==='yellow'?'medium':'hard';
  if(!CURRICULUM[currentGrade] || !CURRICULUM[currentGrade][level]){
    console.error("Curriculum error", currentGrade, level);
    return;
  }
  const q = CURRICULUM[currentGrade][level].generate();
  questionEl.innerText = q[0];
  currentAnswer = String(q[1]);
  startTime = Date.now();
  answerEl.value = '';
  wrongReveal.style.display = 'none';
}

/* ======================================================
   ANSWERS
====================================================== */
function submitAnswer(){
  if(gameLocked) return;
  const val = normalize(answerEl.value);
  if(val==="") return;
  gameLocked = true;
  clearInterval(timerInterval);
  if(val === normalize(currentAnswer)){
    correct();
  }else{
    loseLife(false);
  }
}

function correct(){
  beep(1000,120);
  const t = (Date.now() - startTime)/1000;
  const base = difficulty==='green'?25:difficulty==='yellow'?100:250;
  const mult = t<6?2:(t<11?1.5:1);
  comboCount++;
  const comboBonus = comboCount>=5?3:comboCount>=3?2:1;
  score += Math.floor(base*mult*comboBonus);
  scoreEl.innerText='SCORE: '+score;
  const key='highscore_grade_'+currentGrade;
  const best=parseInt(localStorage.getItem(key)||'0');
  if(score>best) localStorage.setItem(key,score);
  if(comboCount>=3){
    comboDisplay.textContent='🔥 '+comboCount+' IN A ROW! x'+comboBonus+' BONUS!';
    comboDisplay.style.display='block';
    clearTimeout(comboDisplay._timer);
    comboDisplay._timer=setTimeout(()=>{comboDisplay.style.display='none';},1800);
  }
  setTimeout(()=>{
    backToDoors();
    gameLocked = false;
  },250);
}

function loseLife(timedOut){
  gameLocked = true;
  clearInterval(timerInterval);
  beep(150,400,'sawtooth');
  comboCount = 0;
  wrongReveal.textContent = (timedOut?'⏰ TIME UP! ':'✗ WRONG! ') + 'Answer: '+currentAnswer;
  wrongReveal.style.display='block';
  lives--;
  if(lives>=0 && lives<=2) hearts[lives].classList.add('dead');
  if(lives<=0){
    setTimeout(endGame,900);
  }else{
    setTimeout(()=>{
      backToDoors();
      gameLocked = false;
    },900);
  }
}

/* ======================================================
   GAME OVER
====================================================== */
function endGame(){
  const key='highscore_grade_'+currentGrade;
  let best=parseInt(localStorage.getItem(key)||'0');
  if(score>best){ localStorage.setItem(key,score); best=score; }
  const dl = difficulty==='green'?'Easy':difficulty==='yellow'?'Medium':'Hard';
  highScoreText.innerHTML =
    'FINAL SCORE: '+score+'<br><br>'+
    'BEST (GRADE '+currentGrade+'): '+best+'<br><br>'+
    'GRADE '+currentGrade+' · '+dl.toUpperCase();
  gameAreaEl.style.display='none';
  gameOverEl.style.display='block';
}

function shareScore(){
  const dl = difficulty==='green'?'Easy':difficulty==='yellow'?'Medium':'Hard';
  const txt = `🚪 Math Doors – Grade ${currentGrade} ${dl}\nScore: ${score}\nCan you beat me? mathdoors.ca`;
  navigator.clipboard.writeText(txt).then(()=>{
    document.getElementById('shareCopied').style.display='block';
    setTimeout(()=>document.getElementById('shareCopied').style.display='none',2500);
  }).catch(()=>{ prompt('Copy this score:', txt); });
}

/* ======================================================
   RESET
====================================================== */
function restartGame(){
  clearInterval(timerInterval);
  gameLocked=false;
  score=0; lives=3; difficulty=null; comboCount=0;
  scoreEl.innerText='SCORE: 0';
  hearts.forEach(h=>h.classList.remove('dead'));
  gameOverEl.style.display='none';
  gameAreaEl.style.display='none';
  doorsEl.style.display='flex';
  document.querySelectorAll('.door').forEach(d=>{
    d.classList.remove('open');
    d.style.animation = 'none';
    void d.offsetWidth;
    d.style.animation = '';
  });
  answerEl.value='';
  wrongReveal.style.display='none';
  comboDisplay.style.display='none';
  timerEl.style.color='#ffd000';
  timerFill.style.background='#ffd000';
  timerFill.style.width='100%';
}

function backToDoors(){
  gameAreaEl.style.display='none';
  doorsEl.style.display='flex';
  document.querySelectorAll('.door').forEach(d=>{
    d.classList.remove('open');
    /* FIX: 'animation:...forwards' holds its final transform after the
       class is removed in some browsers. Force a reflow so the browser
       re-evaluates the door's style from scratch, otherwise it stays
       visually rotated open even though the .open class is gone. */
    d.style.animation = 'none';
    void d.offsetWidth;
    d.style.animation = '';
  });
  answerEl.value='';
  wrongReveal.style.display='none';
  timerEl.style.color='#ffd000';
  timerFill.style.background='#ffd000';
  timerFill.style.width='100%';
}

}

function openPage(id){
  clearInterval(timerInterval);
  const content = PAGES[id];
  if(!content) return;
  pageContainer.innerHTML = content;
  pageOverlay.classList.add('visible');
  closePageBtn.style.display = 'block';
  if(id === 'curriculum') showGrade(currentGrade);
}

function showGrade(g){
  const info = CURRICULUM_INFO[g];
  if(!info) return;
  for(let i=1;i<=9;i++){
    const btn = document.getElementById('gnav'+i);
    if(btn) btn.classList.toggle('active', i===g);
  }
  const detail = document.getElementById('gradeDetail');
  if(!detail) return;
  detail.innerHTML = `<div class="grade-card"><h3>GRADE ${g} — TOPICS COVERED</h3><ul>${info.topics.map(t=>`<li>${t}</li>`).join('')}</ul><h2 style="margin-top:20px">DIFFICULTY BREAKDOWN</h2><p><span class="tag easy">EASY</span> ${info.easy}</p><p><span class="tag med">MEDIUM</span> ${info.med}</p><p><span class="tag hard">HARD</span> ${info.hard}</p><p style="margin-top:20px"><button onclick="closePage();selectGrade(${g})" style="font-family:'Press Start 2P';font-size:9px;background:black;color:#00ffff;border:2px solid #00ffff;padding:12px 20px;cursor:pointer;">PLAY GRADE ${g}</button></p></div>`;
}

function closePage(){
  pageOverlay.classList.remove('visible');
  closePageBtn.style.display = 'none';
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePage();
});
